<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="kyroShieldGrad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="kyroArrowGrad" x1="45" y1="75" x2="105" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="kyroGlowGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <filter id="kyroDropShadow" x="-10" y="-10" width="140" height="140" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1D4ED8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#kyroGlowGrad)" />

  <!-- Outer Shield Border -->
  <path d="M60 14 C82 14 98 22 98 42 C98 72 68 98 60 106 C52 98 22 72 22 42 C22 22 38 14 60 14 Z" 
        fill="#0F172A" 
        stroke="url(#kyroShieldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#kyroDropShadow)" />

  <!-- Shield Inner Geometry / Letter K & Arrow -->
  <!-- Vertical Pillar of 'K' -->
  <path d="M40 34 L40 78" 
        stroke="url(#kyroShieldGrad)" 
        stroke-width="9" 
        stroke-linecap="round" />

  <!-- Lower Leg of 'K' -->
  <path d="M44 58 L72 82" 
        stroke="url(#kyroShieldGrad)" 
        stroke-width="8" 
        stroke-linecap="round" />

  <!-- Upper Dynamic Arrow of 'K' (Payment Beam) -->
  <path d="M44 56 L82 26" 
        stroke="url(#kyroArrowGrad)" 
        stroke-width="8" 
        stroke-linecap="round" />

  <!-- Arrow Head -->
  <path d="M64 24 L85 24 L85 45" 
        fill="none" 
        stroke="url(#kyroArrowGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Security Pulse Dot -->
  <circle cx="85" cy="24" r="4.5" fill="#38BDF8" />
</svg>