version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: kyrobank-postgres
    restart: always
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: kyrobank_admin
      POSTGRES_PASSWORD: KyroSecurePassword@2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyrobank_admin -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kyrobank-net

  # ----------------------------------------------------------------------------
  # Python AML AI Microservice (FastAPI + Ollama Gateway)
  # ----------------------------------------------------------------------------
  aml-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: kyrobank-aml-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kyrobank-net

volumes:
  pgdata:
    driver: local

networks:
  kyrobank-net:
    driver: bridge
