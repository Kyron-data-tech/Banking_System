spring:
  application:
    name: banking-system

  datasource:
    url: jdbc:h2:file:./data/banking_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 86400000   # 24 hours
  refresh-token-expiration: 604800000 # 7 days
  issuer: kyrobank

gemini:
  api:
    key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.kyrodatatech.banking: DEBUG
    org.springframework.security: INFO
